<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Six-Photo Fix</title><style>
:root{--ink:#251b25;--paper:#fffaf1;--plum:#4d265d;--lilac:#eee4f3;--lime:#c8f45a}*{box-sizing:border-box}body{margin:0;background:#ddd2c7;color:var(--ink);font:17px/1.55 Arial,sans-serif}.book{max-width:760px;margin:auto;background:var(--paper)}.page{min-height:760px;padding:48px 42px;border-bottom:1px solid var(--ink);display:flex;flex-direction:column;justify-content:center}.dark{background:var(--ink);color:#fff}.kicker{margin:0 0 12px;color:var(--plum);font:700 11px/1 monospace;letter-spacing:.1em;text-transform:uppercase}.dark .kicker{color:var(--lime)}h1,h2,h3{font-family:Georgia,serif;letter-spacing:-.045em;line-height:.98}h1{margin:0;font-size:clamp(52px,9vw,82px)}h2{margin:0 0 18px;font-size:clamp(38px,7vw,59px)}h3{margin:0 0 8px;font-size:29px}p{margin:0 0 18px}.lead{max-width:590px;font-size:20px}.box{margin-top:22px;padding:22px;background:var(--lilac);border-left:5px solid var(--plum)}.dark .box{background:#30243a;border-color:var(--lime)}.steps{margin-top:22px;border-top:1px solid var(--ink)}.dark .steps{border-color:#76677d}.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:17px 0;border-bottom:1px solid var(--ink)}.dark .step{border-color:#76677d}.n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--plum);color:#fff;font:12px/1 monospace}.dark .n{background:var(--lime);color:var(--ink)}.photo{display:grid;grid-template-columns:145px 1fr;gap:24px;align-items:start}.photo img{width:145px;aspect-ratio:4/5;object-fit:cover}.prompt{margin-top:22px;padding:19px;background:var(--ink);color:#fff;font:13px/1.55 monospace}.prompt b{display:block;margin-bottom:9px;color:var(--lime);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.check{margin-top:18px;padding:17px;border:1px solid var(--plum)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:18px;background:#f0e7db}.bad{background:#30243a;color:#fff}.final{background:var(--plum);color:#fff}.final .kicker{color:var(--lime)}@media(max-width:560px){.page{min-height:680px;padding:38px 22px}.photo{grid-template-columns:100px 1fr;gap:16px}.photo img{width:100px}.grid{grid-template-columns:1fr}}
</style><style>
/* Editorial web-guide layer: continuous reading, not dashboard panels. */
.page{min-height:0!important;display:block!important;padding:86px 54px!important;border-bottom:1px solid rgba(37,27,37,.22)!important}.dark,.final{padding-top:110px!important;padding-bottom:110px!important}.grid{display:block!important}.card,.bad{margin:0!important;padding:0 0 22px!important;background:transparent!important;color:inherit!important;border-bottom:1px solid rgba(37,27,37,.22)!important}.card h3{margin-top:22px}.box,.check{margin:32px 0 0!important;padding:0!important;background:transparent!important;border:0!important;border-left:0!important}.box b,.check b{color:var(--plum)}.dark .box b,.final .box b{color:var(--lime)}.steps{border:0!important;margin-top:30px!important}.step{padding:20px 0!important}.prompt{margin:32px 0!important;padding:22px 0!important;background:transparent!important;color:inherit!important;border-top:1px solid var(--ink)!important;border-bottom:1px solid var(--ink)!important;font-size:15px!important}.prompt b{color:var(--plum)!important}.photo{grid-template-columns:220px 1fr!important;gap:34px!important}.photo img{width:220px!important}.photo + .page{padding-top:36px!important}@media(max-width:560px){.page{padding:56px 24px!important}.photo{grid-template-columns:1fr!important}.photo img{width:100%!important;max-width:300px}.dark,.final{padding-top:76px!important;padding-bottom:76px!important}}
.contents-list{margin:30px 0 0;padding:0;list-style:none;border-top:1px solid var(--ink)}.contents-list li{border-bottom:1px solid rgba(37,27,37,.22)}.contents-list a{display:flex;gap:18px;align-items:baseline;padding:14px 0;color:inherit;text-decoration:none}.contents-list a:hover{text-decoration:underline}.contents-list span{min-width:28px;color:var(--plum);font:700 11px/1 monospace;letter-spacing:.08em}.contents-list strong{font-family:Georgia,serif;font-size:21px;letter-spacing:-.02em}.contents-list em{margin-left:auto;color:#6f6268;font-size:14px;font-style:normal}
</style></head><body><main class="book" id="book"></main><script>
const photos=[
['Your main photo','Gets her to stop and see the rest of your profile.','exemplar-01-hook.png','Create a natural close photo of me sitting at a café table near a window. I am wearing a dark overshirt over a plain T-shirt. I have just looked up toward the person taking the photo with a small, relaxed smile. Frame me from mid-torso up. Use soft daylight, natural skin texture, and ordinary phone-camera detail. It should look like someone sitting opposite took the photo, not a professional portrait.'],
['A second look at you','Makes the first photo believable in a different moment.','exemplar-02-believe.png','Create a natural phone photo of me sitting at an outdoor table at a casual restaurant. I am looking up from a folded menu with a relaxed half-smile. Use a different outfit from my first photo, soft afternoon daylight, visible skin texture, and ordinary phone-camera framing.'],
['What you do','Shows a normal part of your life, not another close-up.','exemplar-03-dog-on-sofa.png','Create a natural phone photo of me cooking dinner in a normal tidy kitchen. I am stirring pasta and turning toward the friend taking the photo with a small mid-laugh smile. Keep me clearly visible. Use warm kitchen light, ordinary clothes, and a lived-in but tidy background.'],
['How you look when you go out','Shows your build and style without a mirror selfie.','exemplar-04-style.png','Create a natural full-body phone photo of me walking through a local street after leaving a bakery. I am carrying a small paper bag and looking back toward the friend taking the photo. Use a well-fitting casual outfit, normal daylight, realistic fabric creases, and no fashion-campaign pose.'],
['A dateable moment','Makes an easy evening with you feel appealing.','exemplar-05-date.png','Create a natural phone photo of me at a relaxed outdoor pub table in early evening. I am reacting to something funny a friend said, looking across the table rather than at the camera. Use one drink, warm practical light, a normal outfit, and no nightclub or staged-laugh energy.'],
['Something to ask about','Leaves a match with an easy first message.','exemplar-06-hook.png','Create a natural phone photo of me in a small independent record shop, pulling a vinyl record from a crate and looking at the cover. Keep my face visible, use warm shop lighting, ordinary phone-camera colour, and a believable everyday setting.']
];
const photoPages=photos.map((x,i)=>`<section class="page"><p class="kicker">Photo ${i+1} of 6</p><div class="photo"><img src="${x[2]}" alt="Example Photo ${i+1}"><div><h2>${x[0]}</h2><p>${x[1]}</p><p><b>We are aiming for:</b> ${i===0?'a clear face, normal light, and a relaxed expression.':i===5?'one visible detail somebody can ask you about.':'a different, useful side of you.'}</p></div></div></section><section class="page"><p class="kicker">Make Photo ${i+1}</p><h2>Copy this into Gemini.</h2><div class="prompt"><b>Prompt</b>${x[3]}</div><div class="check"><b>When it appears, check three things:</b><br>1. Does the face clearly look like you?<br>2. Does your current hair and facial hair look right?<br>3. Does this do what Photo ${i+1} is meant to do?<br><br><b>If yes:</b> save it as Photo ${i+1}.<br><b>If no:</b> send this: “Make this more realistic. Keep my exact face shape, current haircut and facial hair from the reference photos. Use natural skin texture and ordinary phone-camera detail.”</div></section>`).join('');
document.querySelector('#book').innerHTML=`
<section class="page dark"><p class="kicker">The Six-Photo Fix</p><h1>Build the six photos that get you matches.</h1><p class="lead">Open this with Gemini beside you. We will make one photo at a time, save the good ones, and finish with a profile ready to upload.</p><div class="box"><b>By the end, you will have:</b><br>Six photos ready to upload, the exact order to use them in, and three written answers that make matching easier.</div></section>
<section class="page"><p class="kicker">Page 1 · What you are making</p><h2>Not six random photos. One complete profile.</h2><div class="steps">${photos.map((x,i)=>`<div class="step"><span class="n">0${i+1}</span><div><b>${x[0]}</b><br>${x[1]}</div></div>`).join('')}</div></section>
<section class="page"><p class="kicker">Page 2 · The 10-Selfie Method</p><h2>First, give Gemini a clear picture of you.</h2><p class="lead">These are called reference photos. Gemini uses them to keep your face, hair, body, and age consistent in the photos we make next.</p><div class="steps"><div class="step"><span class="n">3</span><div><b>Clear face photos</b><br>Close, uncovered, current photos where your face is easy to see.</div></div><div class="step"><span class="n">2</span><div><b>Different angles</b><br>Photos from a slight angle, not ten versions of the same selfie.</div></div><div class="step"><span class="n">2</span><div><b>Relaxed expressions</b><br>Normal smiles or natural expressions.</div></div><div class="step"><span class="n">2</span><div><b>More of your body</b><br>Photos that show your build and proportions.</div></div><div class="step"><span class="n">1</span><div><b>Your current look</b><br>Your current haircut and facial hair.</div></div></div></section>
<section class="page"><p class="kicker">Page 3 · Choose the right 10</p><h2>Use clear photos. Leave the confusing ones out.</h2><div class="grid"><div class="card"><h3>Use</h3>Recent photos<br>Face clearly visible<br>Normal light<br>Different angles<br>At least one full-body photo</div><div class="card bad"><h3>Leave out</h3>Group photos<br>Sunglasses<br>Heavy filters<br>Old haircuts<br>Photos where you are tiny</div></div><div class="box"><b>Good enough:</b> if a friend saw these 10 photos, they would know exactly what you look like today.</div></section>
<section class="page"><p class="kicker">Page 4 · Open Gemini</p><h2>Set this up once. Then we make the photos.</h2><div class="steps"><div class="step"><span class="n">01</span><div><b>Open Gemini.</b><br><a href="https://gemini.google.com/" target="_blank">Open Gemini →</a></div></div><div class="step"><span class="n">02</span><div><b>Start a new chat.</b><br>Upload all 10 reference photos together.</div></div><div class="step"><span class="n">03</span><div><b>Paste this message.</b><br>It tells Gemini what must stay consistent in every photo.</div></div></div><div class="prompt"><b>Paste this once</b>I am creating dating-profile photos using these reference photos. Keep my face shape, current haircut, facial hair, skin tone, body type, and age consistent across every image. The photos need to look like natural phone-camera photos, not polished AI portraits.</div></section>
${photoPages}
<section class="page"><p class="kicker">Before you upload</p><h2>Catch the tiny AI mistakes first.</h2><div class="steps"><div class="step"><span class="n">01</span><div><b>Face:</b> it looks exactly like you now.</div></div><div class="step"><span class="n">02</span><div><b>Eyes and skin:</b> they look awake, natural, and human.</div></div><div class="step"><span class="n">03</span><div><b>Hands and body:</b> no strange fingers, teeth, proportions, or clothes.</div></div><div class="step"><span class="n">04</span><div><b>Background:</b> no warped objects, nonsense text, or odd reflections.</div></div><div class="step"><span class="n">05</span><div><b>Whole image:</b> it could pass as a real photo on your camera roll.</div></div></div><div class="box"><b>Five easy yeses:</b> keep it. One obvious no: regenerate that photo. Do not upload an image you have to explain away.</div></section>
<section class="page"><p class="kicker">Upload your profile</p><h2>Put them in this exact order.</h2><div class="steps">${photos.map((x,i)=>`<div class="step"><span class="n">0${i+1}</span><div><b>${x[0]}</b><br>${x[1]}</div></div>`).join('')}</div><div class="box"><b>Do this now:</b> open Tinder, Bumble, or Hinge and replace the old photos with these six.</div></section>
<section class="page"><p class="kicker">Finish the written part</p><h2>Give her something to say after she stops.</h2><div class="steps"><div class="step"><span class="n">01</span><div><b>A date she can picture</b><br>“A good Sunday is a long walk followed by finding somewhere that takes roast potatoes seriously.”</div></div><div class="step"><span class="n">02</span><div><b>A light opinion</b><br>“I will stand by this: a pub quiz needs a music round. Happy to hear the case for anything else.”</div></div><div class="step"><span class="n">03</span><div><b>An easy first message</b><br>“I’m looking for someone who is up for trying the new local place before it gets ruined by TikTok.”</div></div></div><div class="box"><b>Hinge or Bumble:</b> use all three. <b>Tinder:</b> use one as your bio.</div></section>
<section class="page"><p class="kicker">If you get stuck</p><h2>Use the problem you can see.</h2><div class="steps"><div class="step"><span class="n">A</span><div><b>Wrong face, hair, or age:</b> add two clearer current reference photos, then use the correction message again.</div></div><div class="step"><span class="n">B</span><div><b>Plastic skin, strange hands, fake background:</b> regenerate that image. Do not rescue a visibly artificial one.</div></div><div class="step"><span class="n">C</span><div><b>Too many almost-good versions:</b> choose the one that looks most like you and does the slot’s job. Move on.</div></div></div></section>
<section class="page final"><p class="kicker">You are done</p><h2>Your six-photo profile is ready.</h2><p class="lead">Check that six photos are uploaded in order, every photo looks like you, and your written answers are in place.</p><div class="box"><b>Now leave the profile live.</b><br>Do not spend another week moving the same photos around. You have built the profile you came here for: one that gives women a reason to stop, keep looking, and match.</div></section>`;
</script><script>
const book=document.querySelector('#book');const last=book.lastElementChild;
last.insertAdjacentHTML('beforebegin','<section class="page"><p class="kicker">Optional extra prompts</p><h2>Use these once your first six are working.</h2><p class="lead">You do not need more options to finish today. These are here if one of the six scenes does not fit your life.</p><div class="grid"><div class="card"><h3>Outdoors</h3>Park walk, dog walk, post-activity coffee, coastal café.</div><div class="card"><h3>City</h3>Local street, coffee shop, pub table, record shop.</div><div class="card"><h3>Social</h3>After a game, street food, relaxed drinks, local event.</div><div class="card"><h3>Smart-casual</h3>Restaurant table, gallery night, weekend market, dinner out.</div></div></section><section class="page"><p class="kicker">One last check</p><h2>Look at the six together.</h2><div class="steps"><div class="step"><span class="n">01</span><div><b>Two clear views of you</b><br>Your first two photos should make you easy to recognise.</div></div><div class="step"><span class="n">02</span><div><b>Four new things</b><br>The other photos should show life, style, a dateable moment, and one conversation hook.</div></div><div class="step"><span class="n">03</span><div><b>No duplicates</b><br>If two photos do the same thing, keep the stronger one.</div></div></div></section>');
</script><script>
const guideSections=[...book.querySelectorAll('.page')];
const sectionFor=(heading)=>guideSections.find((section)=>section.querySelector('h2')?.textContent.trim()===heading);
const addId=(heading,id)=>{const section=sectionFor(heading);if(section)section.id=id};
addId('Not six random photos. One complete profile.','six-photos');
addId('First, give Gemini a clear picture of you.','reference-photos');
addId('Set this up once. Then we make the photos.','setup');
addId('Catch the tiny AI mistakes first.','quality-check');
addId('Put them in this exact order.','upload');
addId('Give her something to say after she stops.','written-profile');
addId('Use the problem you can see.','stuck');
guideSections.forEach((section)=>{const label=section.querySelector('.kicker')?.textContent.trim();const match=label?.match(/^Photo (\d) of 6$/);if(match)section.id=`photo-${match[1]}`});
book.firstElementChild.insertAdjacentHTML('afterend',`<section class="page" id="contents"><p class="kicker">Contents</p><h2>Start where you are.</h2><p class="lead">If you are new to this, begin with your reference photos. If they are ready, jump straight to the setup and make Photo 1.</p><nav aria-label="Guide contents"><ol class="contents-list"><li><a href="#six-photos"><span>01</span><strong>The six photos</strong><em>See the finished sequence</em></a></li><li><a href="#reference-photos"><span>02</span><strong>Your 10 reference photos</strong><em>Choose what to upload</em></a></li><li><a href="#setup"><span>03</span><strong>Set up Gemini</strong><em>One-time setup</em></a></li><li><a href="#photo-1"><span>04</span><strong>Make the six photos</strong><em>One at a time</em></a></li><li><a href="#quality-check"><span>05</span><strong>Check the finished images</strong><em>Catch the obvious mistakes</em></a></li><li><a href="#upload"><span>06</span><strong>Upload in order</strong><em>Build the profile</em></a></li><li><a href="#written-profile"><span>07</span><strong>Finish the written part</strong><em>Give her something to say</em></a></li><li><a href="#stuck"><span>08</span><strong>If something looks wrong</strong><em>Fix the visible problem</em></a></li></ol></nav></section>`);
</script><script>
const lockedPrompts=[
`Using my uploaded reference photos, create a close candid portrait of me sitting at a small independent café table beside a window. I am wearing a dark overshirt over a plain T-shirt. A coffee is on the table. I have just looked up from the table toward the person taking the photo, with a small natural smile. Frame from mid-torso to above my head; my face and shoulders fill most of the vertical 4:5 photo. Soft daylight from the window, warm café interior, a few blurred people behind me. It should look like a flattering phone photo someone sitting opposite took, not a professional portrait. Keep my face, current hair, age and skin tone exactly like the uploaded photos. Natural skin texture, no airbrushing, no studio light, no fake bokeh.`,
`Using my uploaded reference photos, create a close candid portrait of me sitting at a rustic café table beside a large window. I am wearing a dark jacket over a charcoal T-shirt. A coffee and an open newspaper sit in front of me. I am looking down at the newspaper with a small genuine smile, not looking at the camera. Frame from mid-torso to above my head; I fill most of the vertical 4:5 photo. Brick wall, warm hanging lights and a couple of soft blurred café customers behind me. It feels like someone across the table took one quick flattering phone photo. Keep my uploaded face, haircut, age and skin tone exactly. Natural warm colour, real skin texture, no text readable on the newspaper, no plastic skin or editorial styling.`,
`Using my uploaded reference photos, create a close candid phone photo of me in a normal tidy kitchen while cooking dinner. I am standing by the hob with a wooden spoon in one hand, looking down at the pan with a natural small smile. Frame from mid-thigh to above my head; I fill most of the vertical 4:5 image. I wear a plain T-shirt and dark trousers. A lemon, herbs and a saucepan are visible on the counter, with warm kitchen light and a lived-in background. It should look like a friend took the photo while we were talking in the kitchen. Keep my face and current appearance exactly. Real skin texture and normal phone colour. No chef outfit, luxury flat, food advert or posed cooking scene.`,
`Using my uploaded reference photos, create a close candid portrait of me sitting in a relaxed restaurant booth before dinner. I am wearing a fitted dark overshirt over a plain T-shirt, with dark trousers visible below the table. The friend taking the photo has caught me leaning back slightly in the booth, looking down and smiling at something they just said. Frame from upper thigh to above my head; I fill most of the vertical 4:5 image. A water glass, small menu and warm restaurant lights sit around the edge of the frame. Make it feel like a flattering phone photo someone across the table took, not an outfit photo. Keep my uploaded face, body and current appearance exactly. Natural skin texture, normal phone colour, no fashion campaign, no posed hands.`,
`Using my uploaded reference photos, create a close candid portrait of me sitting at a relaxed bar table in the evening. I am wearing a plain dark T-shirt and simple chain. I have just laughed at something the person opposite said, so I am looking slightly past the camera with a real open smile. Frame from chest to above my head; I fill most of the vertical 4:5 image. One wine glass is partly visible at the bottom of the frame, with warm bar lights and a softly blurred crowd behind me. It should look like a flattering phone photo taken across the table, not a posed portrait or nightclub campaign. Keep my uploaded face, current hair, age and skin tone exactly. Natural skin texture, warm low-light phone colour, no plastic skin or artificial bokeh.`,
`Using my uploaded reference photos, create a close candid phone photo inside a small independent record shop. I am standing beside a wooden record bin, holding one vinyl sleeve at chest height and looking down at the cover with a naturally interested expression. Frame from mid-thigh to above my head; I fill most of the vertical 4:5 image. I wear a dark green overshirt over a faded black T-shirt. Warm shop lights, record sleeves and blurred handwritten shelf labels behind me. It should look like a friend took the picture because I found something good, not a music-video still. Keep my uploaded face and current appearance exactly. Real pores, hair texture and everyday phone colour. No showroom, no DJ pose, no fake vintage filter.`
];
[...document.querySelectorAll('.photo')].forEach((photo,index)=>{const prompt=photo.parentElement.nextElementSibling?.querySelector('.prompt');if(prompt)prompt.innerHTML='<b>Copy this into Gemini</b>'+lockedPrompts[index]});
</script></body></html>
